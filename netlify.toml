[build]
  publish = "."

[[redirects]]
  from = "/tax"
  to = "/tax-relief.html"
  status = 200

[[redirects]]
  from = "/debt"
  to = "/debt-relief.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
